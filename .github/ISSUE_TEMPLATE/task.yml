name: Task
description: A unit of work for the agents
labels: ["ai:backlog"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done, and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design notes
      description: Look, feel, references, constraints.

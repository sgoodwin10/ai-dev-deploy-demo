name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate HTML + build log
        run: npm run validate

      - name: Build site data (real stats, so screenshots show the page as it will look live)
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          bash scripts/telemetry/fetch.sh
          npm run -s stats

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Screenshot QA (desktop/mobile, light/dark)
        run: npm run screenshot

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

      - name: Preview deploy to Cloudflare Pages
        id: preview
        if: ${{ vars.CF_PAGES_PROJECT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=${{ github.head_ref }}

      - name: Comment preview URL
        if: ${{ steps.preview.outputs.deployment-url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.deployment-url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none \
            --body "🔍 **Preview:** $URL  (screenshots attached to the CI run as the \`screenshots\` artifact)"
